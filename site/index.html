<script>
(function(){
var nvs=[].slice.call(document.querySelectorAll('.nv'));
var canHover=window.matchMedia&&window.matchMedia('(hover:hover)').matches;
function closeAll(){nvs.forEach(function(n){n.classList.remove('open');var b=n.firstElementChild;if(b)b.setAttribute('aria-expanded','false')})}
function open(n){closeAll();n.classList.add('open');var b=n.firstElementChild;if(b)b.setAttribute('aria-expanded','true')}
nvs.forEach(function(n){
 var b=n.firstElementChild;
 if(canHover){n.addEventListener('mouseenter',function(){open(n)});n.addEventListener('mouseleave',closeAll)}
 if(b&&b.tagName==='BUTTON')b.addEventListener('click',function(){(n.classList.contains('open')&&!canHover)?closeAll():open(n)});
 if(b&&b.tagName==='A'&&!canHover)b.addEventListener('click',function(e){if(!n.classList.contains('open')){e.preventDefault();open(n)}});
});
document.addEventListener('click',function(e){if(!e.target.closest||!e.target.closest('.nv'))closeAll()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeAll()});
})();
</script>

})();
