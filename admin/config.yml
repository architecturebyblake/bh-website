backend:
  name: github
  repo: architecturebyblake/bh-website
  branch: main

# Photos you upload go here (and existing photos are listed here too).
media_folder: images/uploads
public_folder: /images/uploads

site_url: https://blakehurstarchitecture.netlify.app
display_url: https://blakehurstarchitecture.netlify.app
logo_url: /images/uploads/ce5e5811614ff9664317c23d77206e5a.png

collections:
  - name: projects
    label: Projects
    label_singular: Project
    folder: content/projects
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} ({{category}})"
    sortable_fields: ["title", "order"]
    fields:
      - { label: Project name, name: title, widget: string, hint: "Shown as the page heading and on the portfolio card." }
      - label: Category
        name: category
        widget: select
        options:
          - { label: New Homes, value: new-homes }
          - { label: Additions, value: additions }
          - { label: Interior Renovations, value: renovations }
      - { label: Position in its portfolio list, name: order, widget: number, value_type: int, default: 99, hint: "1 shows first. Lower numbers appear earlier." }
      - { label: Card photo, name: cardImage, widget: image, hint: "The photo on the portfolio page card (for Additions this is the AFTER photo)." }
      - { label: Card photo description, name: cardAlt, widget: string, hint: "Short description for screen readers and search engines." }
      - { label: "Card BEFORE photo (Additions only)", name: cardBeforeImage, widget: image, required: false, hint: "Shown when someone hovers the card." }
      - { label: Card BEFORE photo description, name: cardBeforeAlt, widget: string, required: false }
      - { label: "Card photo focus (optional)", name: cardImagePosition, widget: string, required: false, hint: "For example 50% 60%. Leave empty to center." }
      - { label: Card town and state, name: cardCity, widget: string, hint: "For example Reading, PA" }
      - { label: Card tagline, name: tagline, widget: string }
      - { label: Main photo (top of project page), name: heroImage, widget: image }
      - { label: Main photo description, name: heroAlt, widget: string }
      - label: About the project (paragraphs)
        name: paragraphs
        widget: list
        field: { label: Paragraph, name: paragraph, widget: text }
      - label: Project facts
        name: facts
        widget: list
        hint: "Location, Project type, Year, Size, Scope. Remove any row you don't want shown."
        fields:
          - { label: Label, name: label, widget: string }
          - { label: Value, name: value, widget: string }
      - label: Photo gallery
        name: gallery
        widget: list
        fields:
          - { label: Photo, name: image, widget: image }
          - { label: Photo description, name: alt, widget: string }

  - name: settings
    label: Portfolio page text
    files:
      - label: Portfolio page headings and intros
        name: categories
        file: content/categories.json
        format: json
        fields:
          - label: New Homes page
            name: new-homes
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
          - label: Additions page
            name: additions
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
          - label: Interior Renovations page
            name: renovations
            widget: object
            fields:
              - { label: Heading, name: title, widget: string }
              - { label: Intro, name: intro, widget: text }
